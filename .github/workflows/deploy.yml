name: CD - 프로덕션 배포 (Render 자동 배포)

# Render가 develop 브랜치를 감지하여 자동 배포하므로
# 별도 GitHub Actions 배포 스텝은 필요하지 않습니다.
#
# 배포 흐름:
#   develop push → Render 자동 감지
#     ├─ backend: backend/Dockerfile 빌드 → 컨테이너 배포
#     └─ frontend: npm run build:staging → 정적 파일 배포
#
# 배포 상태 확인: https://dashboard.render.com
# render.yaml 참조

on:
  push:
    branches:
      - develop

jobs:
  notify:
    name: 배포 시작 확인
    runs-on: ubuntu-latest

    steps:
      - name: 배포 트리거 확인
        run: |
          echo "develop 브랜치 push 감지 — Render 자동 배포 진행 중"
          echo "커밋: ${{ github.sha }}"
          echo "배포 대시보드: https://dashboard.render.com"
