name: CI - PR 체크

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: 백엔드 빌드 및 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: .NET 9 설정
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: 의존성 복원
        run: dotnet restore backend/BudgetTracker.Api/BudgetTracker.Api.csproj

      - name: 빌드
        run: dotnet build backend/BudgetTracker.Api/BudgetTracker.Api.csproj --no-restore --configuration Release

      # TODO: 테스트 프로젝트 추가 후 활성화
      # - name: 테스트 실행
      #   run: dotnet test backend/BudgetTracker.sln --no-build --configuration Release

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 프론트엔드 빌드
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
