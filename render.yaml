services:
  # ── 백엔드: .NET 8 Web API ─────────────────────────────────────────────────
  - type: web
    name: budget-tracker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false          # Render 대시보드에서 직접 입력
      - key: Cors__AllowedOrigins__0
        sync: false          # 프론트엔드 URL 입력 (예: https://budget-tracker-web.onrender.com)

  # ── 프론트엔드: Vue3 Static Site ──────────────────────────────────────────
  - type: web
    name: budget-tracker-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false          # 백엔드 URL 입력 (예: https://budget-tracker-api.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
